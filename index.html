function makeIcon(key){

  const c=document.createElement('canvas');c.width=16;c.height=16;const x=c.getContext('2d');
  const px=(X,Y,col)=>{if(X<0||Y<0||X>15||Y>15)return;x.fillStyle=col;x.fillRect(X,Y,1,1);};
  const pal={K,L,A,D,W:'#e2b56a',w:'#b8843f'};
  CONE.forEach((row,j)=>[...row].forEach((ch,i)=>{if(ch!=='.')px(i,10+j,pal[ch]);}));
  const shape=SHAPES[st.shape]||SHAPES.scoop;shape.forEach((row,j)=>[...row].forEach((ch,i)=>{if(ch!=='.')px(i,j,pal[ch]);}));
  const isA=(X,Y)=>{const r=shape[Y];return r&&(r[X]==='A'||r[X]==='L'||r[X]==='D');};
  switch(st.deco){
    case 'dots':[[5,3],[9,2],[7,6],[11,5],[4,6]].forEach(([X,Y])=>{if(isA(X,Y))px(X,Y,c2);});break;
    case 'stripes':[[4,4],[5,5],[6,6],[8,2],[9,3],[10,4],[11,5]].forEach(([X,Y])=>{if(isA(X,Y))px(X,Y,D);});break;
    case 'drip':[[5,9],[5,10],[5,11],[9,9],[9,10],[12,8],[12,9]].forEach(([X,Y])=>px(X,Y,c2));break;
    case 'claw':for(const X of [5,7,9])for(let Y=3;Y<=6;Y++)if(isA(X,Y))px(X,Y,shade(A,-0.55));break;
    case 'scales':for(let Y=2;Y<=8;Y++)for(let X=3;X<=12;X++)if(isA(X,Y)&&(X+Y)%2===0)px(X,Y,D);break;
    case 'eye':for(let Y=3;Y<=5;Y++)for(let X=6;X<=8;X++)px(X,Y,'#fff');px(7,4,'#1a1420');px(6,3,'#f2c14e');break;
    case 'fluff':[[2,3],[13,3],[3,1],[12,1],[1,6],[14,6],[2,8],[13,8]].forEach(([X,Y])=>px(X,Y,L));break;

    case 'sparkle':[[4,2],[11,6]].forEach(([X,Y])=>{px(X,Y,c2);px(X-1,Y,c2);px(X+1,Y,c2);px(X,Y-1,c2);px(X,Y+1,c2);});break;

    case 'fishtail':[[13,3],[14,2],[14,4],[13,4],[14,3]].forEach(([X,Y])=>px(X,Y,D));px(15,2,K);px(15,4,K);break;
    case 'flame':[[7,0],[8,0],[6,1],[9,1],[7,1],[8,1]].forEach(([X,Y])=>px(X,Y,'#f28c28'));px(7,0,'#f4d35e');px(8,1,'#f4d35e');break;
    case 'heart':[[6,3],[8,3],[5,4],[6,4],[7,4],[8,4],[9,4],[6,5],[7,5],[8,5],[7,6]].forEach(([X,Y])=>px(X,Y,'#d13b3b'));px(6,4,'#ff8080');break;
    case 'cherry':px(8,1,'#d13b3b');px(9,1,'#d13b3b');px(8,2,'#d13b3b');px(9,0,'#2f7a3a');px(10,0,'#2f7a3a');break;

  inv:{},stock:{},seeds:{fruit:0,pumpkin:0,strawberry:0,fire:0},items:{rod:false,sword:false},

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function lv(job){let l=0;for(const t of XP_TABLE)if(S.xp[job]>=t)l++;return l;}
function hasSkill(id){const sk=SKILLS[id];if(!sk)return false;if(sk.job)return lv(sk.job)>=sk.lv;return Object.entries(sk.req).every(([j,l])=>lv(j)>=l);}
function addXp(job,n){const before=lv(job);S.xp[job]+=n;const after=lv(job);float(player.x+8,player.y-6,`${JOBS[job]} +${n}`,'#c8f0ff');
  if(after>before){const ns=Object.entries(SKILLS).filter(([id,s])=>(s.job===job&&s.lv===after)||(s.req&&s.req[job]===after&&hasSkill(id)));
    sayQueue([`[${JOBS[job]} Lv${after}] 레벨 업!`+(ns.length?'\n'+ns.map(([id,s])=>`스킬 해금: ${s.name} - ${s.desc}`).join('\n'):'')]);}}
function penCount(){return hasSkill('ranch4')?3:hasSkill('ranch2')?2:1;}
function plotUnlocked(i){const t=PLOTS[i].tier;return t===0||(t===1&&hasSkill('farm2'))||(t===2&&hasSkill('farm4'));}
function atk(){return (S.items.sword?2:1)+(hasSkill('hunt2')?1:0)+(hasSkill('hunt5')?1:0);}
function addStock(key,dl){const k=key+':'+dl;S.stock[k]=(S.stock[k]||0)+1;}
function stockList(){return Object.entries(S.stock).filter(([k,n])=>n>0).map(([k,n])=>{const [key,dl]=k.split(':');return{key,dl:+dl,n,k};});}

// ===================== 입력 / 대화 =====================
const keys={};
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Tab'].includes(e.key))e.preventDefault();
  if(e.repeat)return;
  keys[e.key.toLowerCase()]=true;const k=e.key.toLowerCase();
  if(panel){if(k==='arrowdown')panel.off=Math.min(panel.off+4,Math.max(0,panel.lines.length-26));else if(k==='arrowup')panel.off=Math.max(0,panel.off-4);else panel=null;return;}
  if(msg){
    if(msg.menu){const n=msg.menu.length,cols=n>4?2:1,rows=Math.ceil(n/cols);
      if(/^[1-9]$/.test(e.key)){const m=msg.menu[+e.key-1];if(m){closeMsg();m.fn();}}
      else if(k==='arrowdown')msg.sel=(msg.sel+1)%n;else if(k==='arrowup')msg.sel=(msg.sel-1+n)%n;
      else if(k==='arrowright'||k==='arrowleft'){const s=msg.sel+(k==='arrowright'?rows:-rows);if(s>=0&&s<n)msg.sel=s;}
      else if(e.key===' '||e.key==='Enter'||k==='e'){const m=msg.menu[msg.sel];closeMsg();m.fn();}
      else if(e.key==='Escape'){closeMsg();}}
    else if(e.key===' '||k==='e'||e.key==='Enter'||e.key==='Escape')closeMsg();
    return;}
  if(fishing){if(e.key===' '||k==='e')fishStrike();return;}
  if(e.key===' '||k==='e')interact();
  if(scene==='main'){if(k==='j')openStatus();if(k==='k')openCodex();if(k==='i')openInventory();}
  if(k==='r'&&e.shiftKey){localStorage.removeItem(SAVE_KEY);location.reload();}
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function say(text,menu,onClose){let who=null;const m=/^([^:\n]{1,8}): ([\s\S]*)$/.exec(text);if(m&&PERSON_OF[m[1]]){who=m[1];text=m[2];}
  msg={lines:wrap(text,who?DLGW-56:DLGW-24),menu,onClose,who,sel:0};}
function sayQueue(list,onDone){if(!list.length){if(onDone)onDone();return;}
  const cur=msg;const show=()=>say(list[0],null,()=>sayQueue(list.slice(1),onDone));
  if(cur){const prev=cur.onClose;cur.onClose=()=>{if(prev)prev();show();};}else show();}
function closeMsg(){const m=msg;msg=null;if(m.onClose)m.onClose();}
function note(t,col){toasts.push({text:t,t:3,col:col||'#f4d35e'});if(toasts.length>4)toasts.shift();}
function float(x,y,text,col){floaters.push({x,y,text,col:col||'#fff',t:1.2});}
function wrap(text,maxw){u.font='9px '+FONT;const out=[];for(const para of String(text).split('\n')){let line='';for(const ch of para){line+=ch;if(u.measureText(line).width>maxw){out.push(line);line='';}}out.push(line);}return out;}
function menu(text,items,page=0){const per=7;const pg=items.slice(page*per,page*per+per).map(it=>({label:it.label,fn:it.fn}));
  if(items.length>(page+1)*per)pg.push({label:'다음 ▶',fn:()=>menu(text,items,page+1)});
  if(page>0)pg.push({label:'◀ 이전',fn:()=>menu(text,items,page-1)});
  pg.push({label:'닫기',fn:()=>{}});say(text,pg);}

// ===================== 충돌 =====================
function tileAt(tx,ty){if(tx<0||ty<0||tx>=MW||ty>=MH)return 'W';return MAP[ty][tx];}
function dryerAt(tx,ty){return DRYER_POS.findIndex(d=>d.x===tx&&d.y===ty);}
function objectSolid(tx,ty){
  if(ty===DISPLAY_Y&&DISPLAY_X.includes(tx))return true;
  if(ty===COUNTER_Y&&COUNTER.includes(tx))return true;
  if(dryerAt(tx,ty)>=0)return true;
  if(scene==='tutorial')return tx===OWNER.x&&ty===OWNER.y;
  for(const o of [BED,VENDOR,VENDOR_SIGN,HIVE,CAVE,SIGN_FOREST,SIGN_POND,SIGN_SEA,SIGN_PIER])if(tx===o.x&&ty===o.y)return true;
  if(tx===GATE_MTN.x&&ty===GATE_MTN.y&&!hasSkill('hunt3'))return true;
  if(tx===GATE_LAIR.x&&ty===GATE_LAIR.y&&!hasSkill('hunt5'))return true;
  for(let i=0;i<PENS.length;i++){const p=PENS[i];if(tx===p.x+3&&ty===p.y+4&&i>=penCount())return true;if(S.pens[i]&&tx===p.x+3&&ty===p.y+2)return true;}
  for(let i=0;i<PLOTS.length;i++)if(PLOTS[i].x===tx&&PLOTS[i].y===ty&&plotUnlocked(i))return true;
  for(const [x,y] of TREE_POS)if(x===tx&&y===ty)return true;
  for(const [x,y] of PINE_POS)if(x===tx&&y===ty)return true;
  for(const s of GATHER_SPOTS)if(s.x===tx&&s.y===ty&&spotVisible(s))return true;
  return false;}
function solid(tx,ty){return SOLID_TILES[tileAt(tx,ty)]||objectSolid(tx,ty);}
function canStand(px,py){const pts=[[px+4,py+9],[px+11,py+9],[px+4,py+15],[px+11,py+15]];return pts.every(([x,y])=>!solid(Math.floor(x/T),Math.floor(y/T)));}
function inRect(r,tx,ty){return tx>=r.x0&&tx<=r.x1&&ty>=r.y0&&ty<=r.y1;}
function spotVisible(s){return (!s.skill||hasSkill(s.skill))&&S.gathered[s.id]!==S.day;}

// ===================== 상호작용 =====================
function facing(){const tx=Math.floor((player.x+8)/T),ty=Math.floor((player.y+12)/T);const d=[[0,-1],[0,1],[-1,0],[1,0]][player.dir];return{tx:tx+d[0],ty:ty+d[1],sx:tx,sy:ty};}
function monAt(tx,ty){for(const m of mons){const sz=(MONSTERS[m.kind].size||1)*T;if(tx*T+T>m.x+2&&tx*T<m.x+sz-2&&ty*T+T>m.y+2&&ty*T<m.y+sz-2)return m;}return null;}
// 바라보는 대상의 이름 (힌트 표시용)
function targetLabel(){const f=facing(),hit=o=>o.x===f.tx&&o.y===f.ty;
  if(f.ty===DISPLAY_Y&&DISPLAY_X.includes(f.tx))return '진열장 보기';
  if(scene==='tutorial'){if(hit(OWNER)||(f.ty===COUNTER_Y&&COUNTER.includes(f.tx)))return '주인과 대화';return null;}
  if(f.ty===COUNTER_Y&&COUNTER.includes(f.tx))return '계산대';
  const di=dryerAt(f.tx,f.ty);if(di>=0)return di<S.dryerCount?`동결건조기 ${di+1}호`:`동결건조기 ${di+1}호 (미구매)`;
  if(hit(BED))return '침대에서 자기';if(hit(VENDOR)||hit(VENDOR_SIGN))return '상인과 거래';
  for(let i=0;i<PENS.length;i++){const p=PENS[i];if(f.tx>=p.x&&f.tx<=p.x+6&&f.ty>=p.y&&f.ty<=p.y+4)return `우리 ${i+1}`+(S.pens[i]?` (${ANIMALS[S.pens[i].kind].name})`:'');}
  for(let i=0;i<PLOTS.length;i++)if(PLOTS[i].x===f.tx&&PLOTS[i].y===f.ty)return plotUnlocked(i)?(S.plots[i]?'작물 살펴보기':'씨앗 심기'):'잠긴 밭';
  if(hit(HIVE))return '벌집 채집';for(const s of GATHER_SPOTS)if(s.x===f.tx&&s.y===f.ty&&spotVisible(s))return ingName(s.kind)+' 채집';
  if(hit(SIGN_FOREST)||hit(SIGN_POND)||hit(SIGN_SEA)||hit(SIGN_PIER))return '표지판 읽기';
  if(hit(GATE_MTN)||hit(GATE_LAIR))return '문';if(hit(CAVE))return '동굴';
  const m=monAt(f.tx,f.ty);if(m)return MONSTERS[m.kind].name+' 공격';
  if(tileAt(f.tx,f.ty)==='w')return '낚시';return null;}
function interact(){
  const f=facing(),hit=o=>o.x===f.tx&&o.y===f.ty;
  if(scene==='tutorial'){
    if(f.ty===DISPLAY_Y&&DISPLAY_X.includes(f.tx)){const key=TUTORIAL_SLOTS[DISPLAY_X.indexOf(f.tx)],ic=ICE[key];viewed.add(key);card={key,dl:1,t:5,t0:5,tut:true};
      say(`[${ic.name}]  ${ic.price}원  맛: ${tasteStr(ic.taste)}\n${ic.desc}`);return;}
    if(hit(OWNER)||(f.ty===COUNTER_Y&&COUNTER.includes(f.tx))){
      if(viewed.size<4){say(`주인: 어서 오세요. 천천히 구경하세요. 다 동결건조라 맛은 비슷비슷... 하다고 광고는 합니다. (아직 안 본 메뉴 ${4-viewed.size}개)`);return;}
      sayQueue(['주인: 다 보셨군요. ...그런데 손님, 혹시 가게 하나 물려받을 생각 없으세요?\n저는 곰 잡으러 갔다가 허리가 나갔거든요.',
        '(몇 년 후)\n\n당신은 가게를 물려받았다. 진열장은 텅 비었고, 남은 건 바닐라 레시피와 동결건조기 세 대, 창 한 자루뿐이다.'],startMain);return;}
    say('(신기한 아이스크림 가게다. 진열장을 구경하고 주인에게 말을 걸어보자.)');return;}
  if(f.ty===DISPLAY_Y&&DISPLAY_X.includes(f.tx)){const L=stockList();say(`진열장 (누적 판매 ${S.sold}개)\n`+(L.length?L.map(s=>`${ICE[s.key].name}(${DRY[s.dl].name}) ${s.n}`).join(', '):'바닐라뿐이다.'));return;}
  if(f.ty===COUNTER_Y&&COUNTER.includes(f.tx)){say('계산대. 손님이 알아서 고르고 돈을 두고 간다.');return;}
  const di=dryerAt(f.tx,f.ty);if(di>=0){dryerMenu(di);return;}
  if(hit(BED)){say('잠을 자서 하루를 넘긴다. 체력이 회복된다.',[{label:'잔다',fn:()=>{S.time=DAY_LEN;}},{label:'안 잔다',fn:()=>{}}]);return;}
  if(hit(VENDOR)||hit(VENDOR_SIGN)){vendorMenu();return;}
  for(let i=0;i<PENS.length;i++){const p=PENS[i];if(f.tx>=p.x&&f.tx<=p.x+6&&f.ty>=p.y&&f.ty<=p.y+4){penMenu(i);return;}}
  for(let i=0;i<PLOTS.length;i++)if(PLOTS[i].x===f.tx&&PLOTS[i].y===f.ty){if(plotUnlocked(i))plotAct(i);else say('잠긴 밭. 농사 레벨을 올리면 열린다.');return;}
  if(hit(HIVE)){hiveAct();return;}
  for(const s of GATHER_SPOTS)if(s.x===f.tx&&s.y===f.ty&&spotVisible(s)){gatherAct(s);return;}
  if(hit(SIGN_FOREST)){say('[숲] 벌집·버섯·약초·토끼·곰. 곰은 창으로 3번.');return;}
  if(hit(SIGN_POND)){say('[연못] 낚싯대가 있으면 낚시할 수 있다. (어부 만석이 준다고 한다)');return;}
  if(hit(SIGN_SEA)){say('[바다] 낚시 Lv2부터 해변 낚시. 갈치·청새치.');return;}
  if(hit(SIGN_PIER)){say('[부두] 낚시 Lv5 + 수룡 사냥 스킬이 있으면 심해에서 뭔가 문다.');return;}
  if(hit(GATE_MTN)&&!hasSkill('hunt3')){say('[산 입구] 사냥 Lv3(산길 개척)이 필요하다. 늑대·멧돼지가 산다.');return;}
  if(hit(GATE_LAIR)&&!hasSkill('hunt5')){say('[용의 둥지] 사냥 Lv5(드래곤 슬레이어)가 필요하다.');return;}
  if(hit(CAVE)){say('용의 동굴. 안에서 숨소리가 들린다.');return;}
  const m=monAt(f.tx,f.ty);if(m){attack(m);return;}
  if(tileAt(f.tx,f.ty)==='w'){startFishing(f);return;}
}

function dryerMenu(i){
  if(i>=S.dryerCount){say(`동결건조기 ${i+1}호는 아직 없다. 상인에게 ${DRYER_PRICES[i]}원에 살 수 있다.`);return;}
  const d=S.dryers[i];
  if(d){say(`동결건조기 ${i+1}호 작동 중: ${ICE[d.ice].name} ${DRY[d.dl].name} (${Math.ceil(d.t)}초 남음)`);return;}
  const items=Object.entries(S.inv).filter(([k,n])=>n>0&&ICE[k]).map(([k,n])=>({label:`${ingName(k)} (${n})`,fn:()=>dryLevelMenu(i,k)}));
  if(!items.length){say(`동결건조기 ${i+1}호. 넣을 재료가 없다. 재료를 모아 오자.`);return;}
  menu(`동결건조기 ${i+1}호. 뭘 넣을까?`,items);}
function dryLevelMenu(i,k){

  opts.push({label:'취소',fn:()=>{}});
  say(`${ingName(k)}: 건조 단계 선택. 2단은 강한 맛이 살고, 3단은 맛이 사라지고 꽝꽝 언다.`,opts);}

// ---- 우리 ----
function penMenu(i){
  if(i>=penCount()){say(`잠긴 우리. ${i===1?'목축 Lv2':'목축 Lv4'}가 필요하다.`);return;}
  const p=S.pens[i];if(!p){say(`빈 우리 ${i+1}. 상인에게 동물을 사자.`);return;}
  const a=ANIMALS[p.kind];const items=[];const need=hasSkill('ranch5')?a.feeds-1:a.feeds;const grown=a.feeds&&p.fed>=need;
  let txt=`${a.name}. `;if(a.feeds)txt+=grown?'다 자랐다. ':`성장 ${p.fed}/${need}일. `;
  if(a.product)txt+=`${ingName(a.product.key)}까지 ${a.product.every-(p.ticks%a.product.every)}일. `;
  txt+=p.fedToday?'오늘은 먹었다.':`배고파 보인다. (사료 ${S.inv.feed||0})`;
  if(!p.fedToday)items.push({label:'사료를 준다',fn:()=>{if(!(S.inv.feed>0)){say('사료가 없다.');return;}S.inv.feed--;p.fedToday=true;p.fed++;addXp('ranch',2);float((PENS[i].x+3)*T+8,(PENS[i].y+2)*T,'냠냠','#f4d35e');save();}});
  if(!a.feeds||grown)items.push({label:`도축한다 (${Object.entries(a.butcher).map(([k,n])=>ingName(k)+' '+n).join(', ')})`,fn:()=>{
    for(const [k,n] of Object.entries(a.butcher))S.inv[k]=(S.inv[k]||0)+n;S.pens[i]=null;addXp('ranch',a.xp);if(p.kind==='cub')S.morality-=2;note('도축했다. 재료를 얻었다.');save();}});
  items.push({label:'닫기',fn:()=>{}});say(txt,items);}
// ---- 밭 ----
function plotAct(i){const pl=S.plots[i];
  if(!pl){const it=Object.entries(SEEDS).filter(([k,s])=>S.seeds[k]>0&&(!s.skill||hasSkill(s.skill))).map(([k,s])=>({label:`${s.name} (${S.seeds[k]})`,fn:()=>{S.seeds[k]--;S.plots[i]={seed:k,days:0};addXp('farm',1);save();}}));
    if(!it.length){say('빈 밭. 씨앗이 없다. 상인에게 사자.');return;}menu('무엇을 심을까?',it);return;}
  const s=SEEDS[pl.seed],need=Math.max(1,s.days-(hasSkill('farm3')?1:0));
  if(pl.days>=need){let n=s.yield+(hasSkill('apiary')?1:0)+(hasSkill('farm5')?1:0);S.plots[i]=null;S.inv[s.crop]=(S.inv[s.crop]||0)+n;addXp('farm',4);float(PLOTS[i].x*T+8,PLOTS[i].y*T,`${ingName(s.crop)} +${n}`,'#f4d35e');save();return;}
  say(`${s.name.replace(' 씨앗','')} 자라는 중 (${pl.days}/${need}일)`);}
// ---- 채집 ----
function hiveAct(){if(S.hiveTaken){say('벌집. 오늘은 더 없다. 벌들이 화나 보인다.');return;}
  S.hiveTaken=true;const n=hasSkill('gather3')?2:1;S.inv.honey=(S.inv.honey||0)+n;addXp('gather',3);float(HIVE.x*T+8,HIVE.y*T,`벌집 +${n}`,'#f4d35e');
  if(!hasSkill('gather3')&&Math.random()<0.4){hurt(1);note('벌에 쏘였다!','#ff8080');}save();}
function gatherAct(s){S.gathered[s.id]=S.day;S.inv[s.kind]=(S.inv[s.kind]||0)+1;addXp('gather',s.kind==='spirit'?15:s.kind==='flower'?8:3);float(s.x*T+8,s.y*T,`${ingName(s.kind)} +1`,'#f4d35e');save();}
// ---- 전투 ----
function attack(m){const d=MONSTERS[m.kind];m.hp-=atk();m.flash=0.2;
  const dx=m.x-player.x,dy=m.y-player.y,len=Math.hypot(dx,dy)||1;const nx=m.x+dx/len*12,ny=m.y+dy/len*12;if(monCanStand(m,nx,ny)){m.x=nx;m.y=ny;}
  m.cool=0.3;float(m.x+8,m.y-4,`-${atk()}`,'#ff8080');for(let i=0;i<4;i++)parts.push({x:m.x+8,y:m.y+8,vx:(Math.random()-0.5)*60,vy:-30-Math.random()*40,t:0.4,col:'#ff8080'});
  if(m.hp<=0)kill(m);}
function kill(m){const d=MONSTERS[m.kind];S.killed[m.id]=S.day+d.respawn;mons=mons.filter(x=>x!==m);
  const bonus=hasSkill('hunt4')?1:0;const got=[];
  for(const [k,n] of Object.entries(d.drops)){S.inv[k]=(S.inv[k]||0)+n+bonus;got.push(`${ingName(k)} ${n+bonus}`);}
  addXp('hunt',d.xp);
  if(m.kind==='dragon'){S.flags.dragonKilled=true;S.fame+=100;if(hasSkill('dragon_fert')){S.seeds.fire+=2;got.push('불꽃 씨앗 2 (드래곤 피)');}
    sayQueue([`드래곤을 쓰러뜨렸다!\n해체: ${got.join(', ')}`,'가게 앞에 소문이 퍼진다. 명성 +100']);}
  else if(m.kind==='seadragon'){S.flags.seadragon=true;S.fame+=80;sayQueue([`수룡을 쓰러뜨렸다! ${got.join(', ')}`,'바다의 전설이 시작된다. 명성 +80']);}
  else if(m.kind==='bear'&&hasSkill('tame')&&Math.random()<0.5){const pen=S.pens.findIndex((p,i)=>!p&&i<penCount());
    if(pen>=0){S.pens[pen]={kind:'cub',fed:0,fedToday:false,ticks:0};S.morality+=1;got.push(`새끼곰을 우리 ${pen+1}에 데려왔다`);}
    say(`${d.name} 처치! ${got.join(', ')}`);}
  else note(`${d.name} 처치! ${got.join(', ')}`);
  save();}
function hurt(n){if(player.inv>0||n<=0)return;S.hp-=n;player.hurt=0.5;player.inv=1;if(S.hp<=0)faint();}
function faint(){fishing=null;sayQueue(['쓰러졌다...','눈을 뜨니 침대였다. 지갑이 가벼워졌다.'],()=>{S.money=Math.floor(S.money*0.8);player.x=(BED.x+1)*T;player.y=BED.y*T;S.time=DAY_LEN;S.hp=5;});}
// ---- 낚시 ----
function startFishing(f){
  if(!S.items.rod){say('낚싯대가 없다. 어부 만석이 오기를 기다리거나 상인에게 사자.');return;}
  let zone;if(tileAt(f.sx,f.sy)==='k')zone='deep';else if(inRect(POND,f.tx,f.ty))zone='pond';else zone='sea';
  if(zone==='sea'&&!hasSkill('fish2')){say('바다 낚시는 낚시 Lv2부터. 연못에서 연습하자.');return;}
  if(zone==='deep'&&!hasSkill('fish5')){say('심해 낚시는 낚시 Lv5부터.');return;}
  const cands=Object.entries(FISH).filter(([k,f])=>f.zone===zone&&(!f.fishLv||lv('fish')>=f.fishLv)&&(!f.skill||hasSkill(f.skill)));
  if(!cands.length){say('여기서는 아무것도 안 문다.');return;}
  let tot=cands.reduce((a,[k,f])=>a+f.w,0),r=Math.random()*tot,pick=cands[0][0];for(const [k,f] of cands){r-=f.w;if(r<=0){pick=k;break;}}
  const fd=FISH[pick];const w=fd.zoneW+(hasSkill('fish3')?0.1:0);const c=0.15+Math.random()*0.7;
  fishing={fish:pick,t:Math.random()*10,speed:fd.speed,z0:c-w/2,z1:c+w/2,wait:1+Math.random()*2,bite:false,fx:f.tx*T+8,fy:f.ty*T+8};
  note('찌를 던졌다... 물면 Space!','#8fe3f0');}
function fishPos(){return (Math.sin(fishing.t*fishing.speed)+1)/2;}
function fishStrike(){if(!fishing.bite){note('아직 안 물었다');return;}
  const p=fishPos(),fd=FISH[fishing.fish],key=fishing.fish;const ok=p>=fishing.z0&&p<=fishing.z1;fishing=null;
  if(!ok){note('놓쳤다!','#ff8080');return;}
  if(fd.fight){spawnSeadragon();return;}
  S.inv[key]=(S.inv[key]||0)+1;addXp('fish',fd.xp);float(player.x+8,player.y-8,`${fd.name}!`,'#8fe3f0');save();}
function spawnSeadragon(){const m={id:'sd',kind:'seadragon',x:player.x-32,y:player.y-40,hp:20,home:{x0:38,y0:22,x1:49,y1:28},tx:0,ty:0,cool:0,hit:0,flash:0};
  if(!canStand(m.x,m.y)){m.x=42*T;m.y=26*T;}mons.push(m);say('수룡이 부두 위로 올라왔다! 싸워라!');}

// ===================== 시작 / 하루 =====================
function startMain(){scene='main';S=load()||newState();player.x=S.px*T;player.y=S.py*T;player.dir=1;customers=[];custTimer=3;card=null;
  spawnMonsters();scheduleVisits();
  if(S.day===1&&!S.flags.intro){S.flags.intro=true;
    sayQueue(['가게를 물려받았다.\n방향키 이동, Space 상호작용, 메뉴는 방향키+Enter 또는 숫자키.\nJ 상태·스킬, K 도감, I 가방.',
      '재료를 모아 동결건조기(가게 아래쪽 기계들)에 넣으면 아이스크림이 된다.\n오른쪽 상인에게 돼지·씨앗을 사고, 아래쪽 숲을 노려보자. 30일째 아침에 평가단이 온다.']);}}
function spawnMonsters(){for(const sp of SPAWNS){if(mons.find(m=>m.id===sp.id))continue;if(S.killed[sp.id]>S.day)continue;
  mons.push({id:sp.id,kind:sp.kind,x:sp.x*T,y:sp.y*T,hp:MONSTERS[sp.kind].hp,home:sp.home,tx:sp.x*T,ty:sp.y*T,cool:0,hit:0,flash:0});}}
function scheduleVisits(){visitQueue=[];let i=0;for(const r of REGULARS){const st=S.regulars[r.id]||(S.regulars[r.id]={step:0});
  if(st.step>=r.steps.length)continue;if(S.day<r.first||(S.day-r.first)%r.every)continue;const at=8+i*14;if(S.time<at)visitQueue.push({id:r.id,at});i++;}}
function nextDay(){
  S.day++;S.time=0;S.hp=5;mons=mons.filter(m=>m.kind!=='seadragon');const notes=[];
  S.pens.forEach((p,i)=>{if(!p)return;const a=ANIMALS[p.kind];
    if(p.fedToday){if(a.product){p.ticks++;if(p.ticks%a.product.every===0){S.inv[a.product.key]=(S.inv[a.product.key]||0)+1;notes.push(`${a.name}에게서 ${ingName(a.product.key)} +1`);S.xp.ranch+=3;}}}
    else if(a.feeds)notes.push(`${a.name}이(가) 굶었다.`);p.fedToday=false;});
  S.plots.forEach(p=>{if(p)p.days++;});S.hiveTaken=false;
  if(hasSkill('aquafarm')){S.inv.carp=(S.inv.carp||0)+1;notes.push('양식장에서 붕어 +1');}
  spawnMonsters();scheduleVisits();note(`${S.day}일차 아침`,'#fff');
  if(notes.length)sayQueue([`${S.day}일차 아침.\n`+notes.join('\n')]);
  if(S.day===DATA.ENDING_DAY&&!S.flags.ended)ending();save();}
function ending(){
  const v={dragonKilled:S.flags.dragonKilled,seadragon:S.flags.seadragon,morality:S.morality,money:S.money,sold:S.sold,fame:S.fame,farmLv:lv('farm'),ranchLv:lv('ranch')};
  const ok=(c)=>Object.entries(c).every(([k,val])=>{switch(k){case 'dragonKilled':return v.dragonKilled===val;case 'seadragon':return v.seadragon===val;
    case 'moralityMin':return v.morality>=val;case 'moralityMax':return v.morality<=val;case 'moneyMax':return v.money<=val;case 'soldMax':return v.sold<=val;case 'fameMin':return v.fame>=val;
    case 'farmLv':return v.farmLv>=val;case 'ranchLv':return v.ranchLv>=val;default:return true;}});
  const e=ENDINGS.find(e=>ok(e.cond))||ENDINGS[ENDINGS.length-1];S.flags.ended=e.id;
  sayQueue(['30일째 아침. 평가단이 왔다.',`[엔딩: ${e.title}]\n`+e.text.join('\n'),`명성 ${S.fame} | 도덕 ${S.morality} | 자금 ${S.money}원 | 판매 ${S.sold}개\n가게는 계속된다. (다른 엔딩은 Shift+R로 새 게임)`]);}

// ===================== 손님 =====================
const PATH_IN=[[0,10],[8,10],[8,4]];
function spawnCustomer(regular){
  const slot=DISPLAY_X[Math.floor(Math.random()*DISPLAY_X.length)];
  let type=null;if(!regular){let tot=CUSTOMER_TYPES.reduce((a,t)=>a+t.w,0),r=Math.random()*tot;for(const t of CUSTOMER_TYPES){r-=t.w;if(r<=0){type=t;break;}}type=type||CUSTOMER_TYPES[0];}
  customers.push({spr:regular?regular.spr:type.spr,type,regular,x:0,y:10*T,path:PATH_IN.concat([[slot,4]]).map(([x,y])=>[x*T,y*T]),i:0,state:'in',wait:0,dir:3,walk:0,bought:null,moving:true});}
function customerBuy(c){
  const L=stockList();let pick=null,score=0;
  if(L.length){if(c.type.axis<0){pick=L.reduce((a,b)=>b.dl>a.dl?b:a);score=pick.dl-1;}
    else{for(const s of L){const sc=tasteOf(s.key,s.dl)[c.type.axis];if(sc>score||(sc===score&&pick&&Math.random()<0.5)){score=sc;pick=s;}}if(score===0)pick=null;}}
  if(!pick){if(Math.random()<0.5){S.money+=3;S.sold++;S.fame+=1;c.bought='vanilla';c.bdl=1;float(c.x+8,c.y-6,'+3','#f4d35e');}else float(c.x+8,c.y-6,'취향 아님...','#aaa');}
  else{S.stock[pick.k]--;const p=Math.round(priceOf(pick.key,pick.dl)*(1+0.3*score));S.money+=p;S.sold++;S.fame+=1+Math.floor(p/10);c.bought=pick.key;c.bdl=pick.dl;
    if(ICE[pick.key].dark)S.morality-=2;float(c.x+8,c.y-6,`+${p}원${score>=2?' ♥':''}`,score>=2?'#ffd24a':'#f4d35e');
    if(!S.unlocked[pick.key]){S.unlocked[pick.key]=true;sayQueue([`[첫 판매] ${ICE[pick.key].name}\n${ICE[pick.key].story||''}`]);}
    note(`${c.type.name}: ${ICE[pick.key].name} +${p}원${score>=2?' (취향 적중!)':''}`);}
  save();}
function regularArrive(c){
  const r=c.regular,st=S.regulars[r.id],step=r.steps[st.step];if(!step){c.bought=null;return;}
  const name=r.name;const inStock=step.need?stockList().find(s=>s.key===step.need):null;
  if(step.need&&!inStock){sayQueue([`${name}: ${ICE[step.need].name} 있으면 사고 싶은데... 다음에 또 올게.`]);return;}
  if(inStock){S.stock[inStock.k]--;const p=Math.round(priceOf(step.need,inStock.dl)*1.5);S.money+=p;S.sold++;S.fame+=2+Math.floor(p/10);c.bought=step.need;c.bdl=inStock.dl;if(ICE[step.need].dark)S.morality-=2;float(c.x+8,c.y-6,`+${p}원`,'#ffd24a');}
  const lines=step.text.map(t=>`${name}: ${t}`);
  const finish=(rw,stay)=>{if(rw)applyReward(rw,name);if(!stay&&!step.repeat)st.step++;save();};
  if(step.choice){sayQueue(lines,()=>{say(`${name}: ${step.choice.q}`,[
      {label:'받는다',fn:()=>{sayQueue([`${name}: ${step.choice.yes.text}`]);finish(step.choice.yes.reward,false);}},
      {label:'거절한다',fn:()=>{sayQueue([`${name}: ${step.choice.no.text}`]);finish(null,step.choice.no.stay);}}]);});}
  else sayQueue(lines,()=>finish(step.reward,false));}
function applyReward(rw,who){const got=[];
  if(rw.money){S.money+=rw.money;got.push(`${rw.money}원`);}if(rw.fame){S.fame+=rw.fame;got.push(`명성 +${rw.fame}`);}
  if(rw.morality){S.morality+=rw.morality;got.push(`도덕 ${rw.morality>0?'+':''}${rw.morality}`);}
  for(const src of [rw.xp,rw.xp2])if(src)for(const [j,n] of Object.entries(src)){addXp(j,n);got.push(`${JOBS[j]} XP +${n}`);}
  if(rw.items)for(const [k,n] of Object.entries(rw.items)){
    if(k==='rod'||k==='sword'){S.items[k]=true;got.push(k==='rod'?'낚싯대':'기사의 검');}
    else if(SEEDS[k]){S.seeds[k]+=n;got.push(`${SEEDS[k].name} ${n}`);}
    else{S.inv[k]=(S.inv[k]||0)+n;got.push(`${ingName(k)} ${n}`);}}
  if(got.length)note(`${who}에게서: ${got.join(', ')}`,'#c8f0ff');}
function updateCustomers(dt){
  custTimer-=dt;if(custTimer<=0&&customers.length<4){spawnCustomer(null);custTimer=5+Math.random()*6;}
  for(const v of visitQueue){if(!v.spawned&&S.time>=v.at){v.spawned=true;spawnCustomer(REGULARS.find(r=>r.id===v.id));}}
  for(const c of customers){
    if(c.state==='wait'){c.moving=false;c.wait-=dt;if(c.wait<=0){if(c.regular)regularArrive(c);else customerBuy(c);c.state='out';c.path=c.path.slice().reverse();c.i=1;}continue;}
    const tgt=c.path[c.i];if(!tgt){c.state='done';continue;}
    const dx=tgt[0]-c.x,dy=tgt[1]-c.y,sp=40*dt;c.moving=true;
    if(Math.abs(dx)>sp){c.x+=Math.sign(dx)*sp;c.dir=dx<0?2:3;}else if(Math.abs(dy)>sp){c.y+=Math.sign(dy)*sp;c.dir=dy<0?0:1;}
    else{c.x=tgt[0];c.y=tgt[1];c.i++;if(c.state==='in'&&c.i>=c.path.length){c.state='wait';c.wait=1.2;c.dir=0;}}
    c.walk+=dt*8;}
  customers=customers.filter(c=>c.state!=='done');}

// ===================== 몬스터 =====================
function monCanStand(m,x,y){const sz=MONSTERS[m.kind].size||1;if(sz===1)return canStand(x,y);return canStand(x,y)&&canStand(x+T,y)&&canStand(x,y+T)&&canStand(x+T,y+T);}
function updateMons(dt){
  const ptx=player.x/T,pty=player.y/T;
  for(const m of mons){const d=MONSTERS[m.kind];m.cool-=dt;m.hit-=dt;if(m.flash>0)m.flash-=dt;
    const dist=Math.hypot(player.x-m.x,player.y-m.y),inHome=inRect(m.home,ptx,pty),near=inHome&&dist<d.aggro*T;
    if(m.cool<=0){
      if(d.flee&&dist<4*T){m.tx=m.x+(m.x-player.x)*3;m.ty=m.y+(m.y-player.y)*3;m.cool=0.4;}
      else if(near&&!d.flee){m.tx=player.x;m.ty=player.y;m.cool=0.4;}
      else{m.tx=(m.home.x0+Math.random()*(m.home.x1-m.home.x0))*T;m.ty=(m.home.y0+Math.random()*(m.home.y1-m.home.y0))*T;m.cool=1.5+Math.random()*2;}}
    const dx=m.tx-m.x,dy=m.ty-m.y,len=Math.hypot(dx,dy);m.moving=len>2;
    if(len>2){const sp=(near?d.speed:d.speed*0.45)*dt;const nx=m.x+dx/len*sp,ny=m.y+dy/len*sp;let moved=false;
      if(monCanStand(m,nx,m.y)){m.x=nx;moved=true;}if(monCanStand(m,m.x,ny)){m.y=ny;moved=true;}if(!moved)m.cool=0;m.dir=dx<0?2:3;}
    const sz=(d.size||1)*T;
    if(d.dmg>0&&m.hit<=0&&player.x+12>m.x&&player.x+4<m.x+sz&&player.y+15>m.y&&player.y+8<m.y+sz){
      m.hit=1.2;hurt(d.dmg);note(`${d.name}에게 당했다! -${d.dmg}`,'#ff8080');
      const kx=player.x+Math.sign(player.x-m.x||1)*24,ky=player.y+Math.sign(player.y-m.y||1)*24;if(canStand(kx,player.y))player.x=kx;if(canStand(player.x,ky))player.y=ky;}}}

// ===================== 업데이트 =====================
let last=performance.now();
function update(dt){
  tick+=dt;
  for(const t of toasts)t.t-=dt;toasts=toasts.filter(t=>t.t>0);
  for(const f of floaters){f.t-=dt;f.y-=14*dt;}floaters=floaters.filter(f=>f.t>0);
  for(const p of parts){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}parts=parts.filter(p=>p.t>0);
  if(card){card.t-=dt;if(card.t<=0)card=null;}
  if(player.hurt>0)player.hurt-=dt;if(player.inv>0)player.inv-=dt;
  if(msg||panel)return;
  player.moving=false;
  if(fishing){fishing.t+=dt;if(!fishing.bite){fishing.wait-=dt;if(fishing.wait<=0){fishing.bite=true;fishing.bt=2.5;}}else{fishing.bt-=dt;if(fishing.bt<=0){fishing=null;note('도망갔다...','#ff8080');}}}
